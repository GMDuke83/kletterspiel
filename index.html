<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kletterspiel – Prototyp</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="row"><span class="tag left">L</span><div class="bar"><div id="barL"></div></div><span id="gripL" class="grip"></span></div>
      <div class="row"><span class="tag right">R</span><div class="bar"><div id="barR"></div></div><span id="gripR" class="grip"></span></div>
      <div class="stats">Höhe <b id="height">0 m</b> · Zeit <b id="time">0 s</b> · Stürze <b id="falls">0</b></div>
      <div id="loading">lade Wand …</div>
    </div>
    <div id="help">
      Maus auf einen Griff zielen · <b class="left">linke Maustaste</b> = linke Hand ·
      <b class="right">rechte Maustaste</b> = rechte Hand (oder Q / E) · Mausrad = Kamera · R = Neustart<br />
      <span class="dot jug"></span>Henkel (erholt) <span class="dot crimp"></span>Leiste
      <span class="dot sloper"></span>Sloper <span class="dot summit"></span>Gipfel
    </div>
    <div id="hover"></div>
    <div id="msg"></div>
    <div id="overlay" hidden>
      <h1>Gipfel erreicht!</h1>
      <p id="overlayText"></p>
      <p>Drücke <b>R</b> für einen neuen Versuch.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
